// Fill this in. Each question gets one pick. media: {audio|img|video: "relative/path"} or {draw: "name"} for a live canvas
// sketch drawn by SCENES[name](ctx, t, w, h). rec: true marks Claude's recommendation.
// Moving sketches for the start screen scenes (G0.16). The painting is the scene. Candles, cards, embers, fog and
// ash are drawn on top to show the motion. The game builds the picked one properly.
const IMG = {};
for (const k of ['scene_a', 'scene_b', 'scene_c', 'back']) { const i = new Image(); i.src = 'img/' + k + (k === 'back' ? '.webp' : '.jpg'); IMG[k] = i; }
function cover(g, im, w, h) {
  if (!im.complete || !im.naturalWidth) { g.fillStyle = '#0e0c14'; g.fillRect(0, 0, w, h); return; }
  const k = Math.max(w / im.naturalWidth, h / im.naturalHeight), sw = w / k, sh = h / k;
  g.drawImage(im, (im.naturalWidth - sw) / 2, (im.naturalHeight - sh) / 2, sw, sh, 0, 0, w, h);
}
function glow(g, x, y, r, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, `rgba(255,190,90,${a})`); gr.addColorStop(1, 'rgba(255,190,90,0)'); g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
function flick(t, s) { return 0.55 + 0.25 * Math.sin(t * 9 + s) + 0.12 * Math.sin(t * 23 + s * 3); }
function title(g, w, h, y) {
  g.save(); g.font = '84px GameTitle, Georgia, serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(0,0,0,0.85)'; g.fillText('Gravehand', w / 2 + 3, h * y + 4);
  g.fillStyle = '#e8b84a'; g.fillText('Gravehand', w / 2, h * y); g.restore();
}
function embers(g, t, w, h, n, col) {
  for (let i = 0; i < n; i++) { const s = i * 97.3, x = (s * 13.7) % w + Math.sin(t * 0.7 + s) * 18, y = h - ((t * (24 + (i % 5) * 9) + s * 31) % (h * 0.9)); g.fillStyle = col.replace('A', (0.35 + 0.35 * Math.sin(t * 3 + s)).toFixed(2)); g.beginPath(); g.arc(x, y, 1.6 + (i % 3), 0, 7); g.fill(); }
}
function card(g, x, y, ang, s) {
  const im = IMG.back; g.save(); g.translate(x, y); g.rotate(ang); g.shadowColor = 'rgba(0,0,0,0.6)'; g.shadowBlur = 8;
  if (im.complete && im.naturalWidth) g.drawImage(im, -s * 0.5, -s * 0.7, s, s * 1.4); else { g.fillStyle = '#5a1a22'; g.fillRect(-s * 0.5, -s * 0.7, s, s * 1.4); }
  g.restore();
}
const SCENES = {
  scene_a(g, t, w, h) {
    cover(g, IMG.scene_a, w, h);
    const pulse = 0.5 + 0.5 * Math.sin(t * 1.1); glow(g, w * 0.5, h * 0.2, 170, 0.18 + 0.22 * pulse);      // the rose window breathes
    for (const x of [w * 0.487, w * 0.527]) { const gl = 0.5 + 0.5 * Math.sin(t * 2.2); const gr = g.createRadialGradient(x, h * 0.205, 0, x, h * 0.205, 16); gr.addColorStop(0, `rgba(255,40,40,${0.5 + 0.5 * gl})`); gr.addColorStop(1, 'rgba(255,40,40,0)'); g.fillStyle = gr; g.fillRect(x - 16, h * 0.205 - 16, 32, 32); }
    for (const [x, y, s] of [[w * 0.05, h * 0.9, 1], [w * 0.12, h * 0.62, 2], [w * 0.95, h * 0.9, 3], [w * 0.88, h * 0.62, 4]]) glow(g, x, y, 80, 0.4 * flick(t, s));
    embers(g, t, w, h, 26, 'rgba(255,170,80,A)');
    const k = (t % 4) / 4, lift = Math.sin(k * Math.PI);                  // the top card rises off the altar and settles back
    card(g, w * 0.5, h * 0.8 - lift * h * 0.16, Math.sin(k * Math.PI * 2) * 0.15, 54 + lift * 14);
    title(g, w, h, 0.585);
  },
  scene_b(g, t, w, h) {
    cover(g, IMG.scene_b, w, h);
    for (const [x, y, s] of [[w * 0.29, h * 0.56, 1], [w * 0.31, h * 0.54, 2], [w * 0.33, h * 0.56, 3]]) glow(g, x, y, 55, 0.45 * flick(t, s));
    const cyc = t % 6;                                                    // five cards slide onto the table one at a time, then lift away
    for (let i = 0; i < 5; i++) { const k = Math.min(1, Math.max(0, cyc - i * 0.6)); if (k <= 0) continue; const e = 1 - Math.pow(1 - k, 3);
      g.globalAlpha = cyc > 5 ? Math.max(0, 1 - (cyc - 5)) : 1; card(g, -60 + e * (w * 0.08 + i * 58), h * 0.84, -0.12 + i * 0.05, 48); g.globalAlpha = 1; }
    const gl = Math.max(0, Math.sin(t * 1.3)) ** 12; glow(g, w * 0.79, h * 0.55, 60, 0.9 * gl);       // the crown glints
    title(g, w, h, 0.29);
  },
  scene_c(g, t, w, h) {
    cover(g, IMG.scene_c, w, h);
    for (const [x, y, s] of [[w * 0.11, h * 0.56, 1], [w * 0.64, h * 0.58, 2], [w * 0.5, h * 0.5, 3]]) glow(g, x, y, 80, 0.32 * flick(t, s));
    for (let i = 0; i < 3; i++) { const x = ((t * (14 + i * 6) + i * 260) % (w + 400)) - 200; const gr = g.createRadialGradient(x, h * 0.9, 0, x, h * 0.9, 260); gr.addColorStop(0, 'rgba(200,200,225,0.18)'); gr.addColorStop(1, 'rgba(200,200,225,0)'); g.fillStyle = gr; g.fillRect(x - 260, h * 0.6, 520, h * 0.4); }
    for (let i = 0; i < 40; i++) { const s = i * 53.1, x = (s * 11.3 + Math.sin(t + s) * 20) % w, y = (t * (20 + (i % 4) * 7) + s * 17) % h; g.fillStyle = 'rgba(220,220,230,0.5)'; g.fillRect(x, y, 2, 2); }
    title(g, w, h, 0.22);
  },
};

    const md=o.media||{};
    if(md.img){const e=document.createElement('img');e.src=md.img;e.alt=o.title;c.appendChild(e)}
    if(md.video){const e=document.createElement('video');e.src=md.video;e.controls=true;e.muted=true;e.loop=true;c.appendChild(e)}
    if(md.draw&&SCENES[md.draw]){const e=document.createElement('canvas');e.width=800;e.height=600;e.style.cssText='width:100%;max-width:800px;aspect-ratio:4/3;border-radius:10px;margin:8px 0;background:#000;display:block';e.dataset.draw=md.draw;const wr=document.createElement('div');wr.className='live';wr.appendChild(e);c.appendChild(wr)}
    if(md.audio){const e=document.createElement('audio');e.src=md.audio;e.controls=true;e.preload='none';c.appendChild(e)}
    const b=document.createElement('button');b.className='pick';b.textContent='Pick this one';c.appendChild(b);
    b.onclick=()=>{sec.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');picks[q.id]={q:q.name,o:o.title};draw()};
    sec.querySelector('.grid').appendChild(c)});
  sec.querySelector('textarea').oninput=e=>{(picks[q.id]=picks[q.id]||{q:q.name,o:''}).n=e.target.value;draw()};
  $('#main').appendChild(sec)}
const cvs=[...document.querySelectorAll('canvas[data-draw]')],seen=new Set();
const io=new IntersectionObserver(es=>es.forEach(x=>x.isIntersecting?seen.add(x.target):seen.delete(x.target)));cvs.forEach(c=>io.observe(c));
let speed=2,clock=0,last=0;document.querySelectorAll('.spd').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('.spd').forEach(x=>x.classList.toggle('on',x===b))});
(function loop(ms){clock+=Math.min(100,ms-last)/1000*speed;last=ms;for(const c of seen){const g=c.getContext('2d');g.save();SCENES[c.dataset.draw](g,clock,c.width,c.height);g.restore()}requestAnimationFrame(loop)})(0);
document.addEventListener('play',e=>{document.querySelectorAll('audio,video').forEach(o=>{if(o!==e.target)o.pause()})},true);
function text(){return DECISION.label+': '+DECISION.questions.filter(q=>picks[q.id]).map(q=>{const p=picks[q.id];return q.name+': '+(p.o||'no pick')+(p.n?' ('+p.n.trim()+')':'')}).join('. ')+'.'}
function draw(){const n=DECISION.questions.filter(q=>picks[q.id]&&picks[q.id].o).length;$('#sum').textContent=n?`${n} of ${DECISION.questions.length} picked`+(n<DECISION.questions.length?'':'. Press Copy my picks.'):'No picks yet.'}
$('#copy').onclick=async e=>{try{await navigator.clipboard.writeText(text());e.target.textContent='Copied'}catch(err){e.target.textContent='Select the text to copy'}setTimeout(()=>e.target.textContent='Copy my picks',1800)};
</script></body></html>
